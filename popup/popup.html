<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Page Screenshot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Full Page Screenshot</h1>

    <div class="input-section">
      <label for="urls">URLs (one per line):</label>
      <textarea id="urls" placeholder="https://example.com
https://another-site.com"></textarea>
    </div>

    <div class="options-section">
      <div class="option">
        <label for="delay">Wait after load (ms):</label>
        <input type="number" id="delay" value="1000" min="0" max="10000" step="500">
      </div>
      <div class="option">
        <label for="format">Format:</label>
        <select id="format">
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
        </select>
      </div>
    </div>

    <div class="option" style="margin-bottom: 16px;">
      <label for="clickSelector">Click selector (optional):</label>
      <input type="text" id="clickSelector" placeholder=".cookie-accept, #popup-close">
    </div>

    <button id="startBtn" class="start-btn">Start Capture</button>

    <div id="progress" class="progress-section" style="display: none;">
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <div id="progressText" class="progress-text">0 / 0</div>
    </div>

    <div id="queueSection" class="queue-section" style="display: none;">
      <div class="queue-header">
        <label>Pending URLs:</label>
      </div>
      <textarea id="queueUrls" class="queue-textarea" placeholder="No pending URLs"></textarea>
      <button id="updateQueueBtn" class="queue-btn update-btn">Update Queue</button>

      <div class="queue-header" style="margin-top: 12px;">
        <label>Add URLs:</label>
      </div>
      <textarea id="addUrls" class="queue-textarea" placeholder="Enter URLs to add (one per line)"></textarea>
      <button id="addQueueBtn" class="queue-btn add-btn">Add to Queue</button>
    </div>

    <div id="log" class="log-section"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>

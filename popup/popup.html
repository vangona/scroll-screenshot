<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title"></title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1 data-i18n="title"></h1>

    <div class="input-section">
      <label for="urls" data-i18n="urlLabel"></label>
      <textarea id="urls" placeholder="https://example.com
https://another-site.com"></textarea>
    </div>

    <div class="options-section">
      <div class="option">
        <label for="delay" data-i18n="delayLabel"></label>
        <input type="number" id="delay" value="1000" min="0" max="10000" step="500">
      </div>
      <div class="option">
        <label for="format" data-i18n="formatLabel"></label>
        <select id="format">
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
        </select>
      </div>
    </div>

    <div class="option" style="margin-bottom: 16px;">
      <label for="clickSelector" data-i18n="clickSelectorLabel"></label>
      <input type="text" id="clickSelector" placeholder=".cookie-accept, #popup-close">
    </div>

    <button id="startBtn" class="start-btn" data-i18n="startCapture"></button>

    <div id="progress" class="progress-section" style="display: none;">
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <div id="progressText" class="progress-text">0 / 0</div>
    </div>

    <div id="queueSection" class="queue-section" style="display: none;">
      <div class="queue-header">
        <label data-i18n="pendingUrls"></label>
      </div>
      <textarea id="queueUrls" class="queue-textarea" data-i18n-placeholder="noPendingUrls"></textarea>
      <button id="updateQueueBtn" class="queue-btn update-btn" data-i18n="updateQueue"></button>

      <div class="queue-header" style="margin-top: 12px;">
        <label data-i18n="addUrlsLabel"></label>
      </div>
      <textarea id="addUrls" class="queue-textarea" data-i18n-placeholder="addUrlsPlaceholder"></textarea>
      <button id="addQueueBtn" class="queue-btn add-btn" data-i18n="addToQueue"></button>
    </div>

    <div id="log" class="log-section"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
